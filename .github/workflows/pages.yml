name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Lean and check the library
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true

      - name: Restore documentation cache
        uses: actions/cache@v4
        with:
          path: |
            docbuild/.lake
            .lake/build
            .lake/packages/*/.lake/build
          key: docs-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'docbuild/lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            docs-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'docbuild/lake-manifest.json') }}-

      - name: Install blueprint system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            graphviz libgraphviz-dev \
            texlive-latex-base ghostscript dvisvgm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install blueprint tools
        run: python -m pip install leanblueprint

      - name: Build blueprint HTML
        run: leanblueprint web

      - name: Build Lean API documentation
        working-directory: docbuild
        run: lake build GuibasStolfi:docs

      - name: Assemble website
        run: |
          mkdir -p _site/lean
          cp -a blueprint/web/. _site/
          cp -a docbuild/.lake/build/doc/. _site/lean/

      - name: Upload website
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Publish Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    concurrency:
      group: github-pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
